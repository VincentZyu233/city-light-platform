    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通士达智慧照明SaaS平台</title>
    <script>
      (function() {
        try {
          const mode = localStorage.getItem('topstar_theme');
          const isDark = mode !== 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-brand-500/20 selection:text-brand-600 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
